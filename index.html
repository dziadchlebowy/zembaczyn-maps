<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zembaczyn Maps</title>
<style>
  :root{
    --blue:#1a73e8; --text:#202124; --sub:#5f6368; --line:#e8eaed;
    --shadow:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#ebe8e1;color:var(--text);
    font-family:Roboto,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:14px}
  button{font:inherit;color:inherit}
  #map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  #map.dragging{cursor:grabbing}
  .card{background:#fff;border-radius:8px;box-shadow:var(--shadow)}
  [hidden]{display:none!important}

  /* lewa kolumna: wyszukiwarka + karta obiektu */
  #left{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;
    width:min(392px,calc(100% - 24px));display:flex;flex-direction:column;gap:8px;z-index:5;
    max-height:calc(100% - 100px)}
  #searchcard{position:relative}
  .brand{display:flex;align-items:center;gap:8px;padding:10px 14px 0;font-size:16px;font-weight:500;letter-spacing:.1px}
  .brand svg{flex:none}
  .brand small{color:var(--sub);font-weight:400;font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .searchrow{display:flex;align-items:center;gap:8px;padding:4px 8px 6px 14px;height:48px}
  .searchrow input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;background:transparent;color:var(--text)}
  .searchrow input::placeholder{color:#80868b}
  .iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--sub);flex:none}
  .iconbtn:hover{background:#f1f3f4}
  .iconbtn:focus-visible,.fab:focus-visible,.chip:focus-visible,#results li:focus-visible,.cta:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  #results{position:absolute;left:0;right:0;top:100%;margin:6px 0 0;padding:6px 0;list-style:none;background:#fff;border-radius:8px;box-shadow:var(--shadow);max-height:55vh;overflow:auto}
  #results li{display:flex;align-items:center;gap:12px;padding:8px 14px;cursor:pointer}
  #results li:hover,#results li.active{background:#f1f3f4}
  #results .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  #results .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #results .s{font-size:12px;color:var(--sub)}
  #results .none{padding:10px 14px;color:var(--sub);cursor:default}
  #results .none:hover{background:transparent}

  #info{padding:14px 16px 12px;overflow:auto}
  #info header{display:flex;gap:12px;align-items:flex-start}
  #info .dot{width:14px;height:14px;border-radius:50%;margin-top:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  #info h2{margin:0;font-size:20px;font-weight:400;line-height:1.25;word-break:break-word}
  #info .sub{color:var(--sub);font-size:13px;margin-top:2px}
  #info dl{margin:12px 0 4px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;border-top:1px solid var(--line);padding-top:12px}
  #info dt{color:var(--sub)} #info dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;word-break:break-word}
  #infoCopy{margin-right:8px}
  .cta{margin-top:10px;border:1px solid var(--line);background:#fff;color:var(--blue);padding:7px 16px;border-radius:18px;font-weight:500;cursor:pointer}
  .cta:hover{background:#f6fafe}

  #infoLines{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
  #infoLines h3{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
  #infoBadges{display:flex;flex-wrap:wrap;gap:6px}
  .ln{min-width:38px;padding:4px 9px;border-radius:5px;background:var(--lc,#1a73e8);color:#fff;font-weight:500;font-size:14px;text-align:center;font-variant-numeric:tabular-nums;border:2px solid var(--lc,#1a73e8);line-height:1.2}
  .ln.nz{background:#fff;color:var(--lc,#1a73e8);border-style:dashed}
  .ln.nz small{font-size:10px;font-weight:500;margin-left:4px;opacity:.85}
  button.ln{font:inherit;font-size:14px;font-weight:500;cursor:pointer;line-height:1.2}
  button.ln:hover{filter:brightness(.95)}
  .ln.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--lc,#1a73e8)}
  .ln.alight{background:#5f6368;border-color:#5f6368;font-size:13px}
  #infoDeps{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
  #infoDeps h3{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
  .depmsg{color:var(--sub);font-size:13px;padding:6px 0}
  .dep{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:6px 4px;border-radius:6px;cursor:pointer;text-align:left}
  .dep:hover,.rs:hover{background:#f1f3f4}
  .dep .t{font-weight:500;font-variant-numeric:tabular-nums;min-width:48px}
  .dep .t small{display:block;font-size:10px;color:var(--sub);font-weight:400;line-height:1}
  .dep .ln{min-width:38px;padding:2px 7px;font-size:13px}
  .dep .to,.routehead .to{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3c4043;font-size:13px}
  .dep .rel{color:var(--sub);font-size:12px;white-space:nowrap}
  .more,.back{border:0;background:transparent;color:var(--blue);font-weight:500;padding:6px 4px;cursor:pointer;border-radius:6px}
  .more:hover,.back:hover{background:#f6fafe}
  .routehead{display:flex;align-items:center;gap:10px;padding:4px 4px 8px}
  .routehead .ln{padding:2px 7px;font-size:13px}
  .route{display:flex;flex-direction:column;max-height:46vh;overflow:auto}
  .rs{display:flex;align-items:stretch;gap:8px;width:100%;border:0;background:transparent;padding:0 8px 0 4px;text-align:left;font:inherit;font-size:13px;cursor:pointer;border-radius:4px;color:var(--text)}
  div.rs{cursor:default}
  .rs .t{font-variant-numeric:tabular-nums;color:var(--sub);min-width:40px;padding:6px 0}
  .rs .nm{flex:1;min-width:0;padding:6px 0}
  .rs .nm small{display:block;font-size:11px;color:var(--sub)}
  .rs .bc{position:relative;width:18px;flex:none}
  .rs .bc::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--rc,#1a73e8)}
  .rs.first .bc::before{top:15px}
  .rs.last .bc::before{bottom:auto;height:15px}
  .rs .bead{position:absolute;left:50%;top:15px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;box-sizing:border-box;background:var(--rc,#1a73e8);border:3px solid var(--rc,#1a73e8)}
  .rs.nzs .bead{background:#fff}
  .rs.past .bc::before{background:#c4c7c5}
  .rs.past .bead{border-color:#c4c7c5;background:#c4c7c5}
  .rs.past.nzs .bead{background:#fff}
  .rs.sel{background:#e8f0fe;font-weight:500}
  .rs.sel .t{color:var(--blue)}
  .rs.sel .bead{box-shadow:0 0 0 3px rgba(26,115,232,.3)}
  .rs.past .nm,.rs.nomap .nm{color:#9aa0a6}
  .beadleg{margin-top:8px;font-size:12px;color:var(--sub)}
  .beadleg .lb{display:inline-block;width:11px;height:11px;border-radius:50%;box-sizing:border-box;border:3px solid var(--rc);background:var(--rc);margin:0 5px 0 0;vertical-align:-1px}
  .beadleg .lb.h{background:#fff;margin-left:12px}
  #infoLegend{margin-top:8px;font-size:12px;color:var(--sub)}

  /* prawy dół: zoom + status */
  #zoom{position:absolute;right:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:4}
  .fab{width:40px;height:40px;border:0;background:#fff;border-radius:50%;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:#5f6368}
  .fab:hover{background:#f8f9fa;color:var(--text)}
  #zoom .pair{background:#fff;border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  #zoom .pair .fab{box-shadow:none;border-radius:0;height:40px}
  #zoom .pair hr{margin:0 8px;border:0;border-top:1px solid var(--line)}
  #status{position:absolute;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:12px;padding:3px 10px calc(3px + env(safe-area-inset-bottom,0px));
    background:rgba(255,255,255,.8);font-size:11px;color:#3c4043;border-top-left-radius:4px;backdrop-filter:blur(2px)}
  #coords{font-variant-numeric:tabular-nums;min-width:130px;text-align:right}
  #scale{display:flex;align-items:center;gap:6px}
  #scalebar{height:6px;border:2px solid #3c4043;border-top:0;min-width:10px}

  /* warstwy */
  #layers{position:absolute;left:12px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:6}
  #layersBtn{width:64px;height:64px;border:2px solid #fff;border-radius:8px;box-shadow:var(--shadow);cursor:pointer;padding:0;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#d7e8d0 0 38%,#ebe8e1 38% 62%,#bcd7ef 62%)}
  #layersBtn span{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);font-size:11px;padding:2px 0;font-weight:500}
  #layersPanel{position:absolute;left:0;bottom:76px;width:260px;padding:14px;display:flex;flex-direction:column;gap:12px}
  #layersPanel h3{margin:0;font-size:13px;font-weight:500;color:var(--sub)}
  .chips{display:flex;gap:8px}
  .chip{flex:1;border:2px solid transparent;border-radius:8px;background:#f1f3f4;padding:0;cursor:pointer;overflow:hidden;font-size:12px}
  .chip i{display:block;height:36px}
  .chip b{display:block;font-weight:400;padding:4px 0}
  .chip[aria-pressed=true]{border-color:var(--blue);color:var(--blue)}
  #layersPanel label{display:flex;align-items:center;gap:10px;cursor:pointer}
  #layersPanel input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
  #layersPanel .meta{font-size:12px;color:var(--sub);line-height:1.4}

  /* komunikat */
  #msg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(235,232,225,.92)}
  #msg .box{max-width:460px;padding:24px 26px}
  #msg h1{margin:0 0 8px;font-size:20px;font-weight:500}
  #msg p{margin:0 0 10px;line-height:1.5;color:#3c4043}
  #msg code{background:#f1f3f4;padding:1px 5px;border-radius:4px;font-size:13px}
  #msg .cta{margin-top:6px;background:var(--blue);color:#fff;border-color:var(--blue)}
  #msg .cta:hover{background:#1765cc}
  #drop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(26,115,232,.18);border:4px dashed var(--blue);font-size:20px;font-weight:500;color:var(--blue);pointer-events:none}

  @media (max-width:520px){
    #left{max-height:calc(100% - 150px)}
    #status #coords{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<canvas id="map" tabindex="0" aria-label="Mapa z GeoGebry"></canvas>

<div id="left">
  <div id="searchcard" class="card">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ea4335" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.8" fill="#fff"/></svg>
      <span id="brandtxt" aria-label="Zembaczyn Maps"></span>
      <small id="fileLabel"></small>
    </div>
    <div class="searchrow">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#5f6368" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <input id="q" type="text" placeholder="Szukaj w Zembaczyn Maps" autocomplete="off" spellcheck="false" aria-label="Szukaj obiektów na mapie">
      <button id="clear" class="iconbtn" hidden aria-label="Wyczyść wyszukiwanie"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
    </div>
    <ul id="results" role="listbox" hidden></ul>
  </div>

  <div id="info" class="card" hidden>
    <header>
      <span class="dot" id="infoDot"></span>
      <div style="flex:1;min-width:0"><h2 id="infoTitle"></h2><div class="sub" id="infoSub"></div></div>
      <button id="infoClose" class="iconbtn" aria-label="Zamknij"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
    </header>
    <dl id="infoRows"></dl>
    <div id="infoLines" hidden><h3>Linie</h3><div id="infoBadges"></div><div id="infoLegend"></div></div>
    <div id="infoDeps" hidden></div>
    <button id="infoCopy" class="cta" hidden>Kopiuj link</button>
    <button id="infoZoom" class="cta">Przybliż</button>
  </div>
</div>

<div id="zoom">
  <button id="fit" class="fab" aria-label="Pokaż całą mapę" title="Pokaż całą mapę"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 15H3v4a2 2 0 0 0 2 2h4v-2H5v-4zM5 5h4V3H5a2 2 0 0 0-2 2v4h2V5zm14-2h-4v2h4v4h2V5a2 2 0 0 0-2-2zm0 16h-4v2h4a2 2 0 0 0 2-2v-4h-2v4z"/></svg></button>
  <div class="pair">
    <button id="zin" class="fab" aria-label="Przybliż" title="Przybliż"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
    <hr>
    <button id="zout" class="fab" aria-label="Oddal" title="Oddal"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13H5v-2h14z"/></svg></button>
  </div>
</div>

<div id="status"><span id="coords"></span><span id="scale"><span id="scalebar"></span><span id="scaletxt"></span></span></div>

<div id="layers">
  <div id="layersPanel" class="card" hidden>
    <h3>Typ mapy</h3>
    <div class="chips" id="themeChips"></div>
    <h3>Szczegóły mapy</h3>
    <label><input type="checkbox" id="optLabels"> Etykiety</label>
    <label><input type="checkbox" id="optGrid"> Siatka</label>
    <label><input type="checkbox" id="optMetro"> Linie metra</label>
    <label id="optTerrainWrap" hidden><input type="checkbox" id="optTerrain"> Teren</label>
    <label id="optSatWrap" hidden><input type="checkbox" id="optSat"> Podkład satelitarny</label>
    <button class="cta" id="openFile" style="margin:0;align-self:flex-start">Otwórz plik XML…</button>
    <div class="meta" id="meta"></div>
  </div>
  <button id="layersBtn" aria-label="Warstwy" aria-expanded="false"><span>Warstwy</span></button>
</div>

<div id="msg" hidden><div class="card box">
  <h1 id="msgTitle"></h1><div id="msgBody"></div>
  <button class="cta" id="msgPick">Wybierz plik XML…</button>
</div></div>
<div id="drop" hidden>Upuść plik XML z GeoGebry</div>
<input type="file" id="file" accept=".xml,text/xml,application/xml" hidden>

<script>
(() => {
'use strict';

/* ───────────── KONFIGURACJA ───────────── */
const XML_FILE      = 'geogebra.xml';   // nazwa pliku XML leżącego obok index.html
const FALLBACK_FILES = ['map.xml', 'mapa.xml', 'zembaczyn.xml', 'data.xml']; // próbowane, gdy powyższego brak
const UNIT_NAME     = 'j.';             // jednostka długości w GeoGebrze, np. 'm' albo 'km'
const MIN_FILL_ALPHA = 0.25;            // minimalna nieprzezroczystość wypełnień (GeoGebra domyślnie daje 0.1)

/* ───────────── NARZĘDZIA ───────────── */
const $ = s => document.querySelector(s);
const kid = (el, tag) => { for (const c of el.children) if (c.tagName === tag) return c; return null; };
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const nf = new Intl.NumberFormat('pl-PL', { maximumFractionDigits: 3 });
const f = n => nf.format(Math.abs(n) < 1e-9 ? 0 : n);
const norm = s => String(s).toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const attrList = el => el ? Array.from(el.attributes).sort((a, b) => parseInt(a.name.slice(1)) - parseInt(b.name.slice(1))).map(a => a.value) : [];

/* ───────────── PARSER XML GEOGEBRY ───────────── */
function parseGGB(text) {
  const doc = new DOMParser().parseFromString(text.replace(/^\uFEFF/, '').trim(), 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Ten plik nie jest poprawnym XML-em.');
  const cons = doc.getElementsByTagName('construction')[0];
  if (!cons) throw new Error('Brak sekcji <construction> – to nie wygląda na XML z GeoGebry (plik geogebra.xml z wnętrza .ggb).');

  const elements = new Map(), exprs = new Map(), cmds = [];
  for (const c of cons.children) {
    if (c.tagName === 'element') elements.set(c.getAttribute('label'), c);
    else if (c.tagName === 'expression') exprs.set(c.getAttribute('label'), c.getAttribute('exp') || '');
    else if (c.tagName === 'command') cmds.push({ name: c.getAttribute('name'), inputs: attrList(kid(c, 'input')), outputs: attrList(kid(c, 'output')) });
  }
  const defOf = new Map();
  for (const c of cmds) c.outputs.forEach((l, i) => { if (!defOf.has(l)) defOf.set(l, c); });

  const isVisible = e => { const s = kid(e, 'show'); return s ? s.getAttribute('object') !== 'false' : true; };

  // punkty
  const P = new Map();
  for (const [l, e] of elements) {
    if (e.getAttribute('type') !== 'point') continue;
    const c = kid(e, 'coords'); if (!c) continue;
    const z = num(c.getAttribute('z'), 1);
    if (Math.abs(z) < 1e-12) continue;
    P.set(l, [num(c.getAttribute('x')) / z, num(c.getAttribute('y')) / z]);
  }
  const NUMRE = '[-+]?\\d*\\.?\\d+(?:e[-+]?\\d+)?';
  const litRe = new RegExp('^\\(?\\s*(' + NUMRE + ')\\s*[,;]\\s*(' + NUMRE + ')\\s*\\)?$', 'i');
  const pt = s => {
    if (s == null) return null;
    s = String(s).trim();
    if (P.has(s)) return P.get(s);
    const m = litRe.exec(s);
    if (m) return [parseFloat(m[1]), parseFloat(m[2])];
    if (!/^\(/.test(s)) return null;
    const inner = s.replace(/^\(\s*/, '').replace(/\s*\)$/, '');
    let d = 0, cut = -1;
    for (let i = 0; i < inner.length; i++) { const ch = inner[i]; if (ch === '(') d++; else if (ch === ')') d--; else if ((ch === ',' || ch === ';') && d === 0) { cut = i; break; } }
    if (cut < 0) return null;
    const ev = t => {
      t = t.replace(/\b([xy])\(\s*([^()\s]+)\s*\)/g, (_, a, l) => { const p = P.get(l); return p ? '(' + p[a === 'x' ? 0 : 1] + ')' : 'NaN'; });
      if (!/^[-+*/().\deE\s]+$/.test(t)) return NaN;
      try { return Function('"use strict";return (' + t + ')')(); } catch (e) { return NaN; }
    };
    const a = ev(inner.slice(0, cut)), b = ev(inner.slice(cut + 1));
    return Number.isFinite(a) && Number.isFinite(b) ? [a, b] : null;
  };

  const listPts = str => {
    str = String(str).trim(); if (!str.startsWith('{') || !str.endsWith('}')) return null;
    const items = []; let d = 0, cur = '';
    for (const ch of str.slice(1, -1)) {
      if (ch === '(' || ch === '{') d++; else if (ch === ')' || ch === '}') d--;
      if (ch === ',' && d === 0) { items.push(cur); cur = ''; } else cur += ch;
    }
    items.push(cur);
    const ps = items.map(pt); return ps.every(Boolean) ? ps : null;
  };
  // wielokąty i łamane (+ ich boki)
  const polys = new Map(), edgeOf = new Map();
  for (const c of cmds) {
    if (!/^poly(gon|line)$/i.test(c.name)) continue;
    const verts = []; let n = null;
    for (const s of c.inputs) { const p = pt(s); if (p) verts.push(p); else { const L = listPts(exprs.has(s) ? exprs.get(s) : s); if (L) verts.push(...L); else if (/^\d+$/.test(s.trim())) n = parseInt(s, 10); } }
    if (n && verts.length === 2 && n >= 3) { // wielokąt foremny
      let [a, b] = verts, dx = b[0] - a[0], dy = b[1] - a[1];
      const ang = 2 * Math.PI / n;
      for (let i = 2; i < n; i++) {

    street: street ? (street.name || street.extra || '') : '', bbox: [x, y, x, y], showLabel: false };

}
function clearPinHash() { try { if (location.hash) history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {} }

window.addEventListener('hashchange', () => { if (!pin || location.hash !== pinUrl().slice(location.href.split('#')[0].length)) applyHash(); });
function drawPin() {
  const [sx, sy] = w2s(pin.x, pin.y), r = 11, d = 2.3 * r, phi = Math.acos(r / d), cy = sy - d;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
  ctx.beginPath(); ctx.moveTo(sx, sy);
  ctx.lineTo(sx + r * Math.sin(phi), cy + r * Math.cos(phi));
  ctx.arc(sx, cy, r, Math.PI / 2 - phi, Math.PI / 2 + phi, true);
  ctx.closePath(); ctx.fillStyle = '#ea4335'; ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1; ctx.strokeStyle = '#b31412'; ctx.stroke();
  ctx.beginPath(); ctx.arc(sx, cy, r * .38, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
}
async function copyPinLink() {
  const url = pinUrl(), btn = $('#infoCopy');
  try { await navigator.clipboard.writeText(url); }
  catch (e) { const t = document.createElement('textarea'); t.value = url; document.body.append(t); t.select(); try { document.execCommand('copy'); } catch (e2) {} t.remove(); }
  btn.textContent = 'Skopiowano ✓'; setTimeout(() => { btn.textContent = 'Kopiuj link'; }, 1800);
}

let routeViews = [], routeLabels = [], depFilter = null, depToken = 0, depTimer = 0, depState = null, routeStops = [], routeSet = new Set();
const lineBadge = (n, type, demand) => {
  const b = el('span', 'ln' + (demand ? ' nz' : ''), n); b.style.setProperty('--lc', lineColor(n));
  if (demand) { const sm = el('small', null, 'NŻ'); b.append(sm); b.title = 'Zatrzymuje się na żądanie'; }
  return b;
};
const dayLabel = (when, now) => {
  const a = new Date(when.getFullYear(), when.getMonth(), when.getDate()), b = new Date(now.getFullYear(), now.getMonth(), now.getDate()), diff = Math.round((a - b) / 864e5);
  return diff === 0 ? '' : diff === 1 ? 'jutro' : diff === -1 ? 'wczoraj' : when.toLocaleDateString('pl-PL', { weekday: 'short' });
};
async function showDepartures(stop, count = 1e9) {
  const box = $('#infoDeps'), my = ++depToken;
  clearInterval(depTimer);
  if (!stop.lines.length) { box.hidden = true; return; }
  box.hidden = false;
  if (!box.firstChild || (depState && depState.stop !== stop)) { box.replaceChildren(el('h3', null, 'Odjazdy w ciągu 24 godzin'), el('div', 'depmsg', 'Wczytuję rozkład…')); }
  const res = await computeDepartures(stop);
  if (my !== depToken) return;
  depState = { stop, count, mode: 'deps' };
  routeLabels = []; routeStops = []; routeSet = new Set();
  routeViews = (depFilter ? res.routes.filter(r => r.data.line === depFilter) : res.routes).map(r => ({ geo: routeGeometry(r.data, r.route), color: lineColor(r.data.line), fadeK: null }));
  requestDraw();
  const deps = depFilter ? res.deps.filter(d => d.line === depFilter) : res.deps;
  box.replaceChildren(el('h3', null, 'Odjazdy w ciągu 24 godzin' + (depFilter ? ' · linia ' + depFilter : '')));
  if (!deps.length) box.append(el('div', 'depmsg', 'Brak odjazdów w ciągu najbliższych 24 godzin.'));
  for (const dep of deps.slice(0, count)) {
    const row = el('button', 'dep'); row.type = 'button';
    const t = el('span', 't', hhmm(dep.when)), dl = dayLabel(dep.when, res.now); if (dl) t.append(el('small', null, dl));
    const mins = Math.round((dep.when - res.now) / 60000);
    row.append(t, lineBadge(dep.line, dep.data.type, dep.demand), el('span', 'to', '→ ' + (dep.route.to || '')), el('span', 'rel', mins <= 0 ? 'teraz' : mins < 60 ? `za ${mins} min` : ''));
    row.onclick = () => showRoute(stop, dep);
    box.append(row);
  }
  if (deps.length > count) { const more = el('button', 'more', 'Pokaż więcej'); more.type = 'button'; more.onclick = () => showDepartures(stop, count + 10); box.append(more); }
  if (res.missing.length) box.append(el('div', 'depmsg', `Brak rozkładu dla linii: ${res.missing.join(', ')} (plik ${LINES_DIR}${res.missing[0]}.json).`));
  depTimer = setInterval(() => { if (depState && depState.mode === 'deps' && selected === depState.stop) showDepartures(depState.stop, depState.count); }, 30000);
}
function showRoute(stop, dep) {
  depToken++; clearInterval(depTimer);
  depState = { stop, count: 1e9, mode: 'route' };
  const box = $('#infoDeps'); box.replaceChildren();
  const back = el('button', 'back', '← Odjazdy'); back.type = 'button'; back.onclick = () => { routeStops = []; routeSet = new Set(); routeLabels = []; routeViews = []; requestDraw(); showDepartures(stop, depState.count); };
  const head = el('div', 'routehead'); head.append(lineBadge(dep.line, dep.data.type, false), el('span', 'to', '→ ' + (dep.route.to || '')));
  box.append(back, head);
  const list = el('div', 'route'), matched = []; let selEl = null;
  const rc = lineColor(dep.line); list.style.setProperty('--rc', rc);
  const named = dep.route.stops.map((st, k) => ({ st, k })).filter(x => x.st.name);
  named.forEach(({ st, k }, idx) => {
    const ms = findStop(st.name, st.number, dep.data.type);
    const li = el(ms ? 'button' : 'div', 'rs' + (k === dep.k ? ' sel' : '') + (k < dep.k ? ' past' : '') + (st.request ? ' nzs' : '') + (idx === 0 ? ' first' : '') + (idx === named.length - 1 ? ' last' : '') + (ms ? '' : ' nomap'));
    if (ms) { li.type = 'button'; li.onclick = () => select(ms, true); matched.push(ms); }
    li.title = (st.request ? 'Przystanek na żądanie' : 'Przystanek stały') + (ms ? '' : ' · nie ma go na mapie');
    const tm = new Date(dep.base.getTime() + (st.travelTime || 0) * 60000);
    const bc = el('span', 'bc'); bc.append(el('span', 'bead'));
    const nm = el('span', 'nm', ms ? ms.name : `${st.name} ${/^\d+$/.test(String(st.number || '')) ? parseInt(st.number, 10) : (st.number || '')}`.trim());
    if (st.street) nm.append(el('small', null, st.street));
    li.append(el('span', 't', hhmm(tm)), bc, nm);
    list.append(li); if (k === dep.k) selEl = li;
  });
  box.append(list);
  const lg = el('div', 'beadleg'); lg.style.setProperty('--rc', rc);
  lg.append(el('span', 'lb'), 'stały', el('span', 'lb h'), 'na żądanie'); box.append(lg);
  if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  routeStops = matched; routeSet = new Set(matched); routeLabels = matched;
  routeViews = [{ geo: routeGeometry(dep.data, dep.route), color: rc, fadeK: dep.k }];
  if (matched.length > 1) flyToBBox(ptsBBox(matched.map(o => [o.x, o.y])));
  requestDraw();
}

function select(o, fly) {
  if (pin && o !== pin) { pin = null; clearPinHash(); }
  if (o !== selected) depFilter = null;
  depToken++; clearInterval(depTimer); routeStops = []; routeSet = new Set(); routeViews = []; routeLabels = []; selected = o;
  const box = $('#info'); box.hidden = !o;
  if (o) {
    $('#infoDot').style.background = o.dot || `rgb(${o.rgb.join(',')})`;
    $('#infoTitle').textContent = dispName(o);
    $('#infoSub').textContent = kindName(o) + (o.kind !== 'text' && !o.lines && o.name !== o.label ? ` · ${o.label}` : '');
    const dl = $('#infoRows'); dl.replaceChildren();
    for (const [k, v] of infoRows(o)) { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); }
    const hasL = !!(o.lines && (o.lines.length || o.alight)); $('#infoLines').hidden = !hasL;
    if (hasL) {
      const bx = $('#infoBadges'); bx.replaceChildren();
      $('#infoLines h3').textContent = o.lines.length ? 'Linie' : 'Oznaczenie';
      for (const l of o.lines) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'ln' + (l.demand ? ' nz' : '') + (depFilter === l.n ? ' on' : ''); b.textContent = l.n; b.dataset.line = l.n; b.style.setProperty('--lc', lineColor(l.n));
        b.onclick = () => { depFilter = depFilter === l.n ? null : l.n; bx.querySelectorAll('.ln[data-line]').forEach(x => x.classList.toggle('on', x.dataset.line === depFilter)); showDepartures(o); };
        if (l.demand) { const sm = document.createElement('small'); sm.textContent = 'NŻ'; b.append(sm); b.title = 'Zatrzymuje się na żądanie'; }
        bx.append(b);
      }
      if (o.alight) { const b = document.createElement('span'); b.className = 'ln alight'; b.textContent = 'Przystanek dla wysiadających'; bx.append(b); }
      $('#infoLegend').textContent = o.lines.some(l => l.demand) ? 'NŻ – linia zatrzymuje się na żądanie' : '';
    }
    $('#infoZoom').hidden = !o.bbox;
    $('#infoCopy').hidden = o.cat !== 'pin'; $('#infoCopy').textContent = 'Kopiuj link';

$('#infoClose').onclick = () => select(null);
$('#infoZoom').onclick = () => flyToObj(selected);

/* ───────────── WYSZUKIWARKA ───────────── */
const q = $('#q'), results = $('#results'); let resItems = [], resActive = -1;
function listed() { return (model ? model.objs : []).filter(o => o.visible && (o.kind === 'text' || o.caption || o.showLabel) && o.name); }
function renderResults() {
  const text = norm(q.value.trim());
  $('#clear').hidden = !q.value;
  let items;
  if (!text) items = listed();
  else items = (model ? model.objs : []).filter(o => o.visible && !(o.kind === 'street' && !o.name && !o.extra) && o.cat !== 'tram_track' && !(o.cat === 'metro_line' && !settings.metro) && (norm(o.name).includes(text) || norm(o.label).includes(text) || norm(o.caption || '').includes(text) || (o.extra && norm(o.extra).includes(text))));
  items = items.slice(0, 8); resItems = items; resActive = items.length && text ? 0 : -1;
  results.replaceChildren();
  if (!items.length) {
    if (text) { const li = document.createElement('li'); li.className = 'none'; li.textContent = 'Brak wyników'; results.append(li); }
    results.hidden = !text; return;
  }
  items.forEach((o, i) => {
    const li = document.createElement('li'); li.setAttribute('role', 'option'); li.tabIndex = -1;
    if (i === resActive) li.classList.add('active');
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = o.dot || `rgb(${o.rgb.join(',')})`;
    const box = document.createElement('div'), t = document.createElement('div'), s = document.createElement('div');
    t.className = 't'; t.textContent = dispName(o); s.className = 's'; s.textContent = resultSub(o);
    box.append(t, s); li.append(dot, box);
    li.onmousedown = ev => { ev.preventDefault(); pick(o); };
    results.append(li);
  });
  results.hidden = false;
}
function pick(o) { results.hidden = true; q.blur(); q.value = dispName(o); $('#clear').hidden = false; select(o, true); }
q.addEventListener('input', renderResults);
q.addEventListener('focus', renderResults);
q.addEventListener('blur', () => setTimeout(() => results.hidden = true, 120));
q.addEventListener('keydown', e => {
  const lis = [...results.querySelectorAll('li:not(.none)')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!lis.length) return; e.preventDefault();
    resActive = (resActive + (e.key === 'ArrowDown' ? 1 : -1) + lis.length) % lis.length;
    lis.forEach((l, i) => l.classList.toggle('active', i === resActive));
  } else if (e.key === 'Enter') { const o = resItems[Math.max(0, resActive)]; if (o) pick(o); }
  else if (e.key === 'Escape') { results.hidden = true; q.blur(); }
});
$('#clear').onclick = () => { q.value = ''; q.focus(); renderResults(); };

/* ───────────── WARSTWY ───────────── */
const panel = $('#layersPanel'), lbtn = $('#layersBtn');
function closePanels() { panel.hidden = true; lbtn.setAttribute('aria-expanded', 'false'); }
lbtn.onclick = () => { panel.hidden = !panel.hidden; lbtn.setAttribute('aria-expanded', String(!panel.hidden)); };
const chips = $('#themeChips');
for (const [id, t] of Object.entries(THEMES)) {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.id = id;
  b.innerHTML = '<i></i><b></b>'; b.firstChild.style.background = t.swatch; b.lastChild.textContent = t.name;
  if (id === 'paper') b.firstChild.style.backgroundImage = 'linear-gradient(#ddd 1px,transparent 1px),linear-gradient(90deg,#ddd 1px,transparent 1px)', b.firstChild.style.backgroundSize = '9px 9px';
  b.onclick = () => { settings.theme = id; saveSettings(); syncUI(); requestDraw(); };
  chips.append(b);
}

  $('#optLabels').checked = settings.labels; $('#optGrid').checked = settings.grid; $('#optMetro').checked = settings.metro;
  $('#optTerrain').checked = settings.terrain; $('#optSat').checked = settings.sat;
  $('#optTerrainWrap').hidden = !(terrain && terrain.vec); $('#optSatWrap').hidden = !(terrain && terrain.img);
  const dark = theme().dark; $('#status').style.background = dark ? 'rgba(32,33,36,.8)' : 'rgba(255,255,255,.8)';
  $('#status').style.color = dark ? '#e8eaed' : '#3c4043'; $('#scalebar').style.borderColor = dark ? '#e8eaed' : '#3c4043';
}
$('#optLabels').onchange = e => { settings.labels = e.target.checked; saveSettings(); requestDraw(); };

/* ───────────── WCZYTYWANIE PLIKU ───────────── */
function showMsg(title, html, withPick) {
  $('#msgTitle').textContent = title; $('#msgBody').innerHTML = html;
  $('#msgPick').hidden = !withPick; $('#msg').hidden = false;
}
function loadText(text, name) {
  const m = parseGGB(text);
  model = m; fileName = name;
  order = m.objs.slice().sort((a, b) => (a.layer - b.layer) || (ordOf(a) - ordOf(b)) || (a.id - b.id));
  const bbs = m.objs.filter(o => o.visible && o.bbox).map(o => o.bbox);
  allBBox = bbs.length ? [Math.min(...bbs.map(b => b[0])), Math.min(...bbs.map(b => b[1])), Math.max(...bbs.map(b => b[2])), Math.max(...bbs.map(b => b[3]))] : null;
  buildCaches(); selected = null; $('#info').hidden = true; q.value = ''; $('#clear').hidden = true;
  $('#fileLabel').textContent = name; $('#fileLabel').title = name;
  const shown = m.objs.filter(o => o.visible).length;
  $('#meta').textContent = `Plik: ${name}. Obiektów na mapie: ${shown}.` + (m.skipped ? ` Pominięto ${m.skipped} nieobsługiwanych (np. funkcje, hiperbole).` : '') + (m.unresolved.length ? ` Nie odczytano łamanych/wielokątów: ${m.unresolved.slice(0, 5).join('; ')}.` : '');
  $('#msg').hidden = true;
  resetView(false);
  applyHash();
}
async function boot() {
  const param = new URLSearchParams(location.search).get('file');
  const names = [...new Set([param, XML_FILE, ...FALLBACK_FILES].filter(Boolean))];
  for (const n of names) {
    let text;
    try { const r = await fetch(n, { cache: 'no-cache' }); if (!r.ok) continue; text = await r.text(); } catch (e) { continue; }
    if (!/<construction/i.test(text)) continue;
    try { loadText(text, n); } catch (e) { showMsg('Nie udało się wczytać mapy', `<p>Plik <code>${n.replace(/[<>&]/g, '')}</code> jest, ale: ${String(e.message).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))}</p>`, true); }
    return;
  }
  const local = location.protocol === 'file:';
  showMsg('Nie znaleziono pliku z mapą',
    `<p>Szukałem pliku <code>${XML_FILE}</code> obok <code>index.html</code>. Wrzuć tam XML z GeoGebry (albo zmień <code>XML_FILE</code> na początku skryptu).</p>` +
    (local ? '<p>Strona jest otwarta bezpośrednio z dysku, a przeglądarki blokują wtedy odczyt sąsiednich plików. Na GitHub Pages zadziała to normalnie – tu możesz wskazać plik ręcznie albo upuścić go na okno.</p>' : '<p>Możesz też wskazać plik ręcznie albo upuścić go na okno.</p>'),
    true);
}
const fileInput = $('#file');
const pickFile = () => fileInput.click();
$('#openFile').onclick = pickFile; $('#msgPick').onclick = pickFile;
async function readFile(file) {
  if (!file) return;
  if (/\.ggb$/i.test(file.name)) { showMsg('To archiwum .ggb', '<p>Plik <code>.ggb</code> to spakowany ZIP. Rozpakuj go i użyj pliku <code>geogebra.xml</code> ze środka.</p>', true); return; }
  try { loadText(await file.text(), file.name); } catch (e) { showMsg('Nie udało się wczytać mapy', '<p></p>', true); $('#msgBody').firstChild.textContent = e.message; }
}
fileInput.onchange = () => { readFile(fileInput.files[0]); fileInput.value = ''; };
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; readFile(e.dataTransfer.files[0]); });

/* ───────────── START ───────────── */
function resize() {
  const first = W === 0;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  if (!first && model && anim.mode === null && V.fit === 50 && !allBBox) resetView(false);
  requestDraw();
}
addEventListener('resize', resize);

(function brand() {
  const cols = ['#4285f4', '#ea4335', '#fbbc04', '#4285f4', '#34a853', '#ea4335'], el = $('#brandtxt');
  [...'Zembaczyn'].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.color = cols[i % cols.length]; el.append(s); });
  const m = document.createElement('span'); m.textContent = ' Maps'; m.style.color = '#5f6368'; el.append(m);
})();
syncUI(); resize(); resetView(false);
boot(); loadTerrain();
})();
</script>
