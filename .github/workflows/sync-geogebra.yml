name: Sync GeoGebra

on:
  schedule:
    - cron: '*/15 * * * *'   # co 15 minut (GitHub może opóźnić start)
  workflow_dispatch:          # ręczne uruchomienie: zakładka Actions → Run workflow

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-geogebra
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pobierz projekt z GeoGebry
        run: python sync_geogebra.py ywqqqkgs   # ← tu zmienisz ID projektu

      - name: Zapisz zmiany (tylko gdy plik się zmienił)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- geogebra.xml; then
            echo "Brak zmian."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geogebra.xml
          git commit -m "Aktualizacja geogebra.xml z GeoGebry"
          git push
          # push z GITHUB_TOKEN nie zawsze uruchamia publikację Pages – wymuś ją
          gh api --method POST "/repos/${{ github.repository }}/pages/builds" || echo "Pominięto ręczne wywołanie budowy Pages."
